<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Cinejoy · Lecteur</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vidstack/cdn@1.15.4/styles/player/default/theme.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vidstack/cdn@1.15.4/styles/player/default/layouts/video.css">
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #f5f7fa; background: #101318; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1200px; margin: 0 auto; padding: clamp(20px, 4vw, 48px) 24px 24px; }
    header { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 24px; margin-bottom: 24px; }
    .brand { font-size: 20px; font-weight: 750; }
    h1 { font-size: clamp(20px, 2vw, 24px); font-weight: 450; color: #c2cbd8; margin: 0; overflow-wrap: anywhere; }
    .screen { background: #000; border-radius: 12px; width: 100%; overflow: hidden; }
    media-player { width: 100%; aspect-ratio: 16 / 9; max-height: 74svh; --media-brand: #a9dfff; --media-focus-ring-color: #a9dfff; }
    media-provider, media-provider video { height: 100%; }
    media-google-cast-button, media-airplay-button { display: none; }
    .choices { display: flex; flex-wrap: wrap; align-items: end; gap: 16px; margin-top: 24px; }
    .field { display: grid; gap: 8px; flex: 1 1 250px; max-width: 520px; }
    .field.narrow { flex: 0 1 180px; }
    label { color: #c2cbd8; font-size: 14px; }
    select, button { font: inherit; font-size: 16px; color: #f5f7fa; background: #1d242e; border: 1px solid #4b5768; border-radius: 8px; min-height: 44px; padding: 10px 12px; }
    select { width: 100%; text-overflow: ellipsis; }
    button { cursor: pointer; }
    button:hover, select:hover { background: #273240; }
    :focus-visible { outline: 2px solid #a9dfff; outline-offset: 4px; }
    select:disabled, button:disabled { opacity: .6; cursor: wait; }
    .help, footer { color: #aeb9c9; font-size: 14px; line-height: 1.6; max-width: 75ch; }
    .help { margin: 20px 0 0; }
    footer { margin-top: 32px; }
    #status { margin: 0 0 16px; font-size: 16px; color: #c2cbd8; line-height: 1.6; }
    #status[data-error] { color: #ffb6ae; }
    #retry { margin-top: 12px; }
    [hidden] { display: none !important; }
    @media (max-width: 560px) {
      main { padding: 20px 16px; }
      header { margin-bottom: 16px; }
      .screen { border-radius: 8px; }
      .choices { margin-top: 20px; }
      .field, .field.narrow { flex-basis: 100%; max-width: none; }
      footer { margin-top: 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      media-player *, media-player *::before, media-player *::after { animation-duration: 0s !important; transition-duration: 0s !important; }
    }
  </style>
</head>
<body>
  <main>
    <header><span class="brand">Cinejoy</span><h1 id="title">Lecteur navigateur</h1></header>
    <p id="status" role="status" aria-live="polite">Chargement du lecteur…</p>
    <div class="screen">
      <media-player title="Cinejoy" aria-label="Lecteur vidéo" view-type="video" stream-type="on-demand" playsinline load="eager">
        <media-provider></media-provider>
        <media-video-layout></media-video-layout>
      </media-player>
    </div>
    <button id="retry" type="button" hidden>Réessayer cette source</button>
    <div class="choices">
      <div class="field">
        <label for="source">Source vidéo</label>
        <select id="source" disabled></select>
      </div>
      <div id="file-quality" class="field narrow" hidden>
        <label for="quality">Qualité</label>
        <select id="quality"></select>
      </div>
    </div>
    <p class="help">Qualité automatique ou manuelle, pistes audio, sous-titres et vitesse : ouvre les réglages du lecteur.</p>
    <footer>Garde le terminal Python ouvert pendant la lecture.</footer>
    <noscript>Active JavaScript pour utiliser le lecteur Vidstack.</noscript>
  </main>
  <script id="cinejoy-config" type="application/json">__CINEJOY_CONFIG__</script>
  <script type="module" nonce="__CINEJOY_NONCE__">
    const config = JSON.parse(document.querySelector('#cinejoy-config').textContent);
    const player = document.querySelector('media-player');
    const layout = document.querySelector('media-video-layout');
    const sourceSelect = document.querySelector('#source');
    const qualitySelect = document.querySelector('#quality');
    const status = document.querySelector('#status');
    const retry = document.querySelector('#retry');
    let activeSource = config.selectedSource;
    let activeVariant = 0;
    let pendingResume = null;
    let externalTracks = [];
    let ready = false;
    let connectionLost = false;
    document.querySelector('#title').textContent = config.title;
    document.title = `${config.title} · Cinejoy`;

    function showStatus(message, error = false) {
      status.textContent = message;
      status.hidden = !message;
      status.toggleAttribute('data-error', error);
      retry.hidden = !error || !ready;
    }

    function qualityLabel(quality) {
      return quality === 'auto' ? 'Qualité d’origine' : /^\d+$/.test(quality) ? `${quality}p` : quality;
    }

    function rememberPlayback() {
      // Un changement rapide conserve la position d'avant le premier chargement.
      if (!pendingResume) {
        const caption = player.textTracks.selected;
        pendingResume = {
          time: player.currentTime || 0, playing: !player.paused,
          rate: player.playbackRate, volume: player.volume, muted: player.muted,
          caption: caption ? { language: caption.language, label: caption.label } : null,
        };
      }
    }

    function loadSource(sourceIndex, variantIndex, preserve = true) {
      const source = config.sources[sourceIndex];
      const variant = source.variants[variantIndex];
      if (preserve) rememberPlayback();
      activeSource = sourceIndex;
      activeVariant = variantIndex;
      sourceSelect.value = String(sourceIndex);
      qualitySelect.replaceChildren(...source.variants.map((entry, index) => new Option(qualityLabel(entry.quality), index)));
      qualitySelect.value = String(variantIndex);
      document.querySelector('#file-quality').hidden = source.variants.length < 2;
      for (const track of externalTracks) player.textTracks.remove(track);
      externalTracks = [];
      for (const [index, caption] of source.captions.entries()) {
        const id = `external-${sourceIndex}-${index}`;
        player.textTracks.add({ ...caption, id });
        const track = player.textTracks.getById(id);
        if (track) externalTracks.push(track);
      }
      showStatus('Chargement de la source…');
      // Le type explicite permet de lire les URL sans extension fournies par certains serveurs.
      player.src = { src: variant.src, type: variant.type };
    }

    try {
      const { LocalMediaStorage } = await import('https://cdn.jsdelivr.net/npm/@vidstack/cdn@1.15.4/player.js');
      await customElements.whenDefined('media-player');
      await customElements.whenDefined('media-video-layout');
      // Conserve les réglages dans cette page, sans écrire dans localStorage.
      // Vidstack les relit lors de son initialisation asynchrone après can-play.
      class SessionMediaStorage extends LocalMediaStorage {
        onChange() {}
        save() {}
        saveTime() {}
        async getTime() { return null; } // La position est gérée par pendingResume.
      }
      player.storage = new SessionMediaStorage();
      player.title = config.title;
      player.setAttribute('aria-label', `Lecteur vidéo · ${config.title}`);
      layout.translations = {
        'Announcements': 'Annonces', 'Accessibility': 'Accessibilité', 'Audio': 'Audio',
        'Auto': 'Automatique', 'Boost': 'Amplification', 'Captions': 'Sous-titres',
        'Caption Styles': 'Style des sous-titres', 'Captions look like this': 'Aperçu des sous-titres',
        'Chapters': 'Chapitres', 'Closed-Captions Off': 'Désactiver les sous-titres',
        'Closed-Captions On': 'Activer les sous-titres', 'Connected': 'Connecté', 'Continue': 'Continuer',
        'Connecting': 'Connexion', 'Default': 'Par défaut', 'Disabled': 'Désactivé',
        'Disconnected': 'Déconnecté', 'Display Background': 'Fond du lecteur', 'Download': 'Télécharger',
        'Enter Fullscreen': 'Plein écran', 'Enter PiP': 'Mode incrustation', 'Exit Fullscreen': 'Quitter le plein écran',
        'Exit PiP': 'Quitter l’incrustation', 'Font': 'Police', 'Family': 'Famille', 'Fullscreen': 'Plein écran',
        'Keyboard Animations': 'Animations du clavier', 'LIVE': 'DIRECT', 'Loop': 'Lecture en boucle',
        'Mute': 'Couper le son', 'Normal': 'Normale', 'Off': 'Désactivé', 'Pause': 'Pause',
        'Play': 'Lire', 'Playback': 'Lecture', 'PiP': 'Incrustation', 'Quality': 'Qualité',
        'Replay': 'Relire', 'Reset': 'Réinitialiser', 'Seek Backward': 'Reculer', 'Seek Forward': 'Avancer',
        'Seek': 'Position', 'Settings': 'Réglages', 'Skip To Live': 'Revenir au direct', 'Speed': 'Vitesse',
        'Size': 'Taille', 'Color': 'Couleur', 'Opacity': 'Opacité', 'Shadow': 'Ombre', 'Text': 'Texte',
        'Text Background': 'Fond du texte', 'Track': 'Piste', 'Unmute': 'Rétablir le son', 'Volume': 'Volume',
      };
      // HLS.js expose les qualités et les pistes, y compris sur les navigateurs avec HLS natif.
      player.preferNativeHLS = false;
      for (const [index, source] of config.sources.entries()) {
        const first = source.variants[0];
        const suffix = source.variants.length > 1 ? `${source.variants.length} qualités` :
          first.type === 'application/x-mpegurl' ? 'HLS' : `${qualityLabel(first.quality)} · ${first.format}`;
        sourceSelect.add(new Option(`${source.label} · ${suffix}`, index));
      }
      sourceSelect.addEventListener('change', () => loadSource(Number(sourceSelect.value), 0));
      qualitySelect.addEventListener('change', () => loadSource(activeSource, Number(qualitySelect.value)));
      retry.addEventListener('click', () => {
        rememberPlayback();
        player.src = '';
        requestAnimationFrame(() => loadSource(activeSource, activeVariant));
      });
      player.addEventListener('can-play', () => {
        showStatus('');
        if (pendingResume) {
          const resume = pendingResume;
          pendingResume = null;
          if (resume.time > 0 && Number.isFinite(player.duration)) {
            player.currentTime = Math.min(resume.time, Math.max(0, player.duration - .1));
          }
          player.playbackRate = resume.rate;
          player.volume = resume.volume;
          player.muted = resume.muted;
          if (resume.caption) {
            const tracks = player.textTracks.toArray();
            const caption = tracks.find(track => track.language === resume.caption.language && track.label === resume.caption.label)
              ?? tracks.find(track => track.language === resume.caption.language && ['captions', 'subtitles'].includes(track.kind));
            if (caption) caption.mode = 'showing';
          }
          if (resume.playing) player.play().catch(() => showStatus('Appuie sur Lire pour reprendre.'));
        }
      });
      player.addEventListener('error', () => showStatus(
        connectionLost ? 'Le relais est arrêté. Relance le script Python pour reprendre la lecture.' :
          'Cette source ne peut pas être lue. Réessaie, choisis une autre source ou utilise VLC si le codec est incompatible.', true,
      ));
      const initial = config.sources[activeSource].variants.findIndex(v => v.index === config.selectedStream);
      ready = true;
      sourceSelect.disabled = false;
      loadSource(activeSource, Math.max(0, initial), false);
      // Le relais reste actif jusqu'à Ctrl+C ; détecte sa fermeture sans renouveler les flux.
      setInterval(async () => {
        if (document.hidden) return;
        try {
          const response = await fetch(location.href, { method: 'HEAD', cache: 'no-store', signal: AbortSignal.timeout(4000) });
          if (!response.ok) throw new Error('Relay closed');
          connectionLost = false;
        } catch {
          connectionLost = true;
          showStatus('Le relais est arrêté. Relance le script Python pour reprendre la lecture.', true);
        }
      }, 15000);
    } catch (error) {
      showStatus('Vidstack n’a pas pu être chargé. Vérifie ta connexion puis recharge cette page.', true);
      console.error('Initialisation Vidstack :', error);
    }
  </script>
</body>
</html>
