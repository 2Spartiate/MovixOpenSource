name: Android TV foundations

on:
  workflow_dispatch:
  push:
    branches:
      - agent/google-tv-roadmap-v1
      - agent/google-tv-clean-baseline-v1
      - agent/google-tv-clean-integration-v1
      - agent/google-tv-dom-safety-ab-v1
      - agent/google-tv-navigation-polish-v1
      - agent/google-tv-header-row-icon-v1
      - agent/google-tv-offscreen-focus-v3
      - agent/google-tv-launcher-carousel-focus-v4
      - agent/google-tv-home-focus-platform-v5
      - agent/google-tv-nav-hardening-v6
      - agent/google-tv-header-numeric-shortcuts-v7
      - agent/google-tv-menu-ime-polish-v8
      - agent/google-tv-global-hero-neon-v9
      - agent/google-tv-search-focus-polish-v10
      - agent/google-tv-detail-exit-polish-v11
      - agent/google-tv-playback-ux-v12
    paths:
      - 'app/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-tv-foundations.yml'

concurrency:
  group: android-tv-foundations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  validate:
    name: Contracts, frontend and standalone Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Android shell dependencies
        working-directory: app
        run: npm ci

      - name: Rebuild injected userscript
        working-directory: app
        run: npm run build:userscript

      - name: Validate clean baseline, TV runtime and handheld isolation contracts
        working-directory: app
        run: |
          node --test \
            tests/tvBaselineRuntimeDiagnosticContract.test.mjs \
            tests/cleanBaselineBrandingContract.test.mjs \
            tests/commonWebViewOverridesContract.test.mjs \
            tests/tvRuntimeContract.test.mjs \
            tests/tvWebViewBootstrapContract.test.mjs \
            tests/tvSpatialEngine.test.mjs \
            tests/tvFocusDom.test.mjs \
            tests/tvDpadRuntime.test.mjs \
            tests/tvHeaderContract.test.mjs \
            tests/tvPreplayAdGateContract.test.mjs \
            tests/tvHlsControlsFocusContract.test.mjs \
            tests/tvHlsDpadShortcutContract.test.mjs \
            tests/tvHlsRemoteNavigationContract.test.mjs \
            tests/tvPlaybackPolicy.test.mjs \
            tests/tvPlaybackQuickMenuContract.test.mjs \
            tests/tvPlaybackRemoteV12Contract.test.mjs \
            tests/tvOriginalLanguageContract.test.mjs \
            tests/tvPlayerMenusContract.test.mjs \
            tests/tvLivePlayerDpadContract.test.mjs \
            tests/tvFrancePlayerDpadContract.test.mjs \
            tests/tvPlayerBackContract.test.mjs \
            tests/tvExternalPlayerLimitsContract.test.mjs \
            tests/tvCarouselContract.test.mjs \
            tests/tvFocusRestoration.test.mjs \
            tests/tvUiCleanupContract.test.mjs \
            tests/androidArtifactCleanupContract.test.mjs
          npx tsc --noEmit

      - name: Validate frontend production build
        env:
          # Build-only public origin. This workflow validates compilation and
          # does not deploy the generated frontend.
          VITE_SITE_URL: https://movix.example
        run: npm run build

      - name: Build standalone Android APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew \
            :app:processReleaseMainManifest \
            :app:assembleRelease \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
            --stacktrace

      - name: Assert merged TV and mobile manifest contracts
        working-directory: app/android
        shell: bash
        run: |
          set -euo pipefail
          MERGED="$(find app/build/intermediates -type f -name AndroidManifest.xml -path '*release*' | head -n 1)"
          test -n "$MERGED"
          echo "Merged manifest: $MERGED"
          grep -q 'android.software.leanback' "$MERGED"
          grep -q 'android.hardware.touchscreen' "$MERGED"
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' "$MERGED"
          grep -q 'android.intent.category.LAUNCHER' "$MERGED"
          grep -q 'android:banner="@drawable/tv_banner"' "$MERGED"
          grep -q 'android.support.v4.content.FileProvider\|androidx.core.content.FileProvider' "$MERGED"
          grep -q 'com.movix.app.cast.CastOptionsProvider' "$MERGED"

      - name: Assert standalone JS bundle is packaged
        working-directory: app/android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          echo "Standalone React Native bundle is packaged in $APK"

      - name: Delete previous Movix Android APK/AAB artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACTS_FILE="${RUNNER_TEMP}/movix-android-artifacts.txt"
          : > "${ARTIFACTS_FILE}"

          page=1
          while true; do
            response="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&page=${page}")"
            count="$(jq '.artifacts | length' <<<"${response}")"

            jq -r --argjson current_run "${GITHUB_RUN_ID}" '
              .artifacts[]
              | select(
                  (.workflow_run.id != $current_run)
                  and (.name | test("^movix-google-tv-(standalone|debug)-(apk|aab)$"; "i"))
                )
              | "\(.id)|\(.name)|\(.workflow_run.id)"
            ' <<<"${response}" >> "${ARTIFACTS_FILE}"

            if [ "${count}" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done

          if [ ! -s "${ARTIFACTS_FILE}" ]; then
            echo "No previous APK/AAB artifacts to delete."
          else
            while IFS='|' read -r artifact_id artifact_name artifact_run; do
              echo "Deleting artifact ${artifact_id}: ${artifact_name} (run ${artifact_run})"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            done < "${ARTIFACTS_FILE}"
          fi

      - name: Upload Google TV standalone APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: movix-google-tv-standalone-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
